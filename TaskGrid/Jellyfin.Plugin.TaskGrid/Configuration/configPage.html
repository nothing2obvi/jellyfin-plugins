<!DOCTYPE html>
<html lang="en">
<head>
    <title>Task Grid</title>
</head>
<body>
    <div id="TaskGridConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
        data-require="emby-button,emby-checkbox,emby-input">
        <div data-role="content">
            <div class="content-primary taskGridPage">
                <div class="sectionTitleContainer flex align-items-center taskGridHeader">
                    <h2 class="sectionTitle">Task Grid</h2>
                    <button is="emby-button" type="button" id="TaskGridRefresh" class="raised taskGridRefreshButton">
                        <span>Refresh</span>
                    </button>
                </div>

                <div class="verticalSection">
                    <div class="taskGridToolbar">
                        <label class="emby-checkbox-label taskGridToggle">
                            <input type="checkbox" id="TaskGridShowUnscheduled" is="emby-checkbox" />
                            <span>Show tasks without daily or weekly triggers in links</span>
                        </label>
                    </div>
                    <div id="TaskGridStatus" class="fieldDescription"></div>
                </div>

                <div id="TaskGridWarnings" class="taskGridWarnings" hidden></div>

                <div class="verticalSection">
                    <div class="taskGridScroll">
                        <div id="TaskGridCalendar" class="taskGridCalendar" aria-label="Weekly scheduled task grid"></div>
                    </div>
                </div>

                <div class="verticalSection">
                    <h3 class="sectionTitle">Task Colors</h3>
                    <div id="TaskGridStyleList" class="taskGridStyleList"></div>
                    <button is="emby-button" type="button" id="TaskGridSave" class="raised button-submit taskGridSaveButton">
                        <span>Save Display Preferences</span>
                    </button>
                </div>

                <div class="verticalSection">
                    <h3 class="sectionTitle">Task Scheduler Links</h3>
                    <div id="TaskGridSchedulerLinks" class="taskGridSchedulerLinks"></div>
                </div>
            </div>
        </div>

        <style>
            .taskGridHeader {
                gap: 1rem;
                justify-content: space-between;
            }

            .taskGridRefreshButton,
            .taskGridSaveButton {
                width: auto;
            }

            .taskGridToolbar {
                display: flex;
                flex-wrap: wrap;
                gap: 1rem 2rem;
                align-items: center;
            }

            .taskGridToggle {
                margin: 0;
            }

            .taskGridWarnings {
                border-left: 4px solid #d64045;
                background: rgba(214, 64, 69, 0.12);
                padding: 0.75rem 1rem;
                margin: 1rem 0;
            }

            .taskGridWarningItem {
                margin: 0.35rem 0;
            }

            .taskGridScroll {
                overflow-x: auto;
                border: 1px solid rgba(255, 255, 255, 0.16);
                border-radius: 8px;
                background: rgba(0, 0, 0, 0.14);
            }

            .taskGridCalendar {
                min-width: 1180px;
                display: grid;
                grid-template-columns: 8rem repeat(24, minmax(2.6rem, 1fr));
                grid-template-rows: 2.4rem repeat(7, 5.8rem);
                position: relative;
            }

            .taskGridCorner,
            .taskGridHour,
            .taskGridDay,
            .taskGridCell {
                border-right: 1px solid rgba(255, 255, 255, 0.10);
                border-bottom: 1px solid rgba(255, 255, 255, 0.10);
                box-sizing: border-box;
            }

            .taskGridCorner,
            .taskGridHour {
                position: sticky;
                top: 0;
                z-index: 4;
                background: rgb(28, 32, 37);
            }

            .taskGridCorner,
            .taskGridDay {
                position: sticky;
                left: 0;
                z-index: 3;
                background: rgb(28, 32, 37);
            }

            .taskGridCorner {
                z-index: 5;
            }

            .taskGridHour {
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.75rem;
                opacity: 0.78;
            }

            .taskGridDay {
                display: flex;
                align-items: center;
                padding: 0 0.75rem;
                font-weight: 600;
            }

            .taskGridDayToday {
                box-shadow: inset 4px 0 0 #00a4dc;
            }

            .taskGridCell {
                background: rgba(255, 255, 255, 0.025);
            }

            .taskGridNowLine {
                position: absolute;
                top: 2.4rem;
                bottom: 0;
                width: 2px;
                background: #f25f5c;
                box-shadow: 0 0 8px rgba(242, 95, 92, 0.75);
                pointer-events: none;
                z-index: 2;
            }

            .taskGridBlock {
                position: relative;
                margin: 0.45rem 0.22rem;
                padding: 0.35rem 0.45rem;
                min-width: 0;
                min-height: 2.1rem;
                overflow: hidden;
                border-radius: 6px;
                color: #fff;
                box-shadow: 0 2px 7px rgba(0, 0, 0, 0.28);
                z-index: 1;
                align-self: start;
                cursor: pointer;
            }

            .taskGridBlockWarning {
                outline: 2px solid #ff5c5c;
                box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 12px rgba(255, 92, 92, 0.72);
            }

            .taskGridBlockHeavy {
                border-top: 3px solid rgba(255, 255, 255, 0.85);
            }

            .taskGridBlockTitle {
                display: block;
                font-size: 0.78rem;
                font-weight: 700;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .taskGridBlockMeta {
                display: block;
                margin-top: 0.2rem;
                font-size: 0.68rem;
                opacity: 0.92;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .taskGridRetryTicks {
                position: absolute;
                left: 0.3rem;
                right: 0.3rem;
                bottom: 0.18rem;
                height: 0.25rem;
                pointer-events: none;
            }

            .taskGridRetryTick {
                position: absolute;
                bottom: 0;
                width: 0.22rem;
                height: 0.22rem;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.9);
                box-shadow: 0 0 5px rgba(255, 255, 255, 0.6);
                transform: translateX(-50%);
            }

            .taskGridStyleList {
                display: grid;
                gap: 0.6rem;
            }

            .taskGridStyleRow {
                display: grid;
                grid-template-columns: minmax(12rem, 1fr) 5rem 8rem minmax(12rem, 18rem) 7rem;
                gap: 0.75rem;
                align-items: center;
                padding: 0.6rem 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.10);
            }

            .taskGridTaskName {
                min-width: 0;
            }

            .taskGridTaskName strong,
            .taskGridTaskName span {
                display: block;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .taskGridTaskName span {
                font-size: 0.78rem;
                opacity: 0.72;
            }

            .taskGridColorInput {
                width: 5rem;
                min-height: 2.4rem;
            }

            .taskGridHexInput {
                width: 8rem;
                text-transform: uppercase;
            }

            .taskGridRecentColors {
                display: flex;
                flex-wrap: wrap;
                gap: 0.35rem;
                align-items: center;
            }

            .taskGridRecentColor {
                width: 1.6rem;
                height: 1.6rem;
                border: 1px solid rgba(255, 255, 255, 0.72);
                border-radius: 4px;
                background: var(--task-grid-recent-color);
                cursor: pointer;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
            }

            .taskGridHeavyLabel {
                display: flex;
                align-items: center;
                gap: 0.4rem;
                margin: 0;
            }

            .taskGridSchedulerLinks {
                display: grid;
                gap: 0.5rem;
            }

            .taskGridSchedulerLink {
                display: grid;
                grid-template-columns: minmax(12rem, 1fr) minmax(14rem, 1.25fr) auto;
                gap: 0.75rem;
                align-items: center;
                padding: 0.55rem 0.75rem;
                border-left: 4px solid currentColor;
                background: rgba(255, 255, 255, 0.06);
                color: inherit;
                text-decoration: none;
            }

            .taskGridSchedulerLink span {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .taskGridSchedulerSummary {
                opacity: 0.72;
            }

            .taskGridSchedulerLink em {
                font-style: normal;
                opacity: 0.72;
            }

            .taskGridSchedulerLinkFocus {
                outline: 2px solid #00d5ff;
                box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 12px rgba(0, 213, 255, 0.72);
            }

            @media (max-width: 720px) {
                .taskGridStyleRow {
                    grid-template-columns: 1fr;
                }

                .taskGridSchedulerLink {
                    grid-template-columns: 1fr;
                }
            }
        </style>

        <script type="text/javascript">
            (function () {
                const pluginId = 'a56a1707-aaeb-4ed5-bd95-1543ff817b9e';
                const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
                const dayIndexes = { Monday: 0, Tuesday: 1, Wednesday: 2, Thursday: 3, Friday: 4, Saturday: 5, Sunday: 6 };
                const defaultColors = ['#00a4dc', '#27ae60', '#f39c12', '#8e5ad7', '#16a085', '#d35400', '#607d8b', '#c0392b'];

                let currentConfig = { TaskStyles: [], ShowUnscheduledTasks: true };
                let scheduledTasks = [];

                document.querySelector('#TaskGridConfigPage').addEventListener('pageshow', loadPage);
                document.querySelector('#TaskGridRefresh').addEventListener('click', refreshTasks);
                document.querySelector('#TaskGridSave').addEventListener('click', savePreferences);
                document.querySelector('#TaskGridShowUnscheduled').addEventListener('change', function () {
                    currentConfig.ShowUnscheduledTasks = this.checked;
                    render();
                });

                async function loadPage() {
                    Dashboard.showLoadingMsg();
                    try {
                        currentConfig = await ApiClient.getPluginConfiguration(pluginId);
                        currentConfig.TaskStyles = currentConfig.TaskStyles || [];
                        currentConfig.RecentColors = currentConfig.RecentColors || [];
                        document.querySelector('#TaskGridShowUnscheduled').checked = currentConfig.ShowUnscheduledTasks !== false;
                        await refreshTasks(false);
                    } catch (error) {
                        console.error('Error loading Task Grid:', error);
                        Dashboard.alert('Error loading Task Grid');
                    } finally {
                        Dashboard.hideLoadingMsg();
                    }
                }

                async function refreshTasks(showLoading) {
                    if (showLoading !== false) {
                        Dashboard.showLoadingMsg();
                    }

                    try {
                        scheduledTasks = await ApiClient.getScheduledTasks();
                        render();
                        document.querySelector('#TaskGridStatus').textContent = 'Last refreshed ' + new Date().toLocaleString();
                    } catch (error) {
                        console.error('Error refreshing scheduled tasks:', error);
                        Dashboard.alert('Error refreshing scheduled tasks');
                    } finally {
                        if (showLoading !== false) {
                            Dashboard.hideLoadingMsg();
                        }
                    }
                }

                async function savePreferences() {
                    Dashboard.showLoadingMsg();
                    try {
                        const stylesByKey = new Map((currentConfig.TaskStyles || []).map(function (style) {
                            return [style.TaskKey, style];
                        }));

                        document.querySelectorAll('.taskGridStyleRow').forEach(function (row) {
                            const key = row.dataset.taskKey;
                            const color = normalizeHexColor(row.querySelector('.taskGridHexInput').value, row.querySelector('.taskGridColorInput').value);
                            stylesByKey.set(key, {
                                TaskKey: key,
                                Color: color,
                                Heavy: row.querySelector('.taskGridHeavyInput').checked
                            });
                            rememberColor(color);
                        });

                        currentConfig.TaskStyles = Array.from(stylesByKey.values());
                        currentConfig.RecentColors = normalizeRecentColors(currentConfig.RecentColors);
                        currentConfig.ShowUnscheduledTasks = document.querySelector('#TaskGridShowUnscheduled').checked;
                        await ApiClient.updatePluginConfiguration(pluginId, currentConfig);
                        Dashboard.processPluginConfigurationUpdateResult();
                    } catch (error) {
                        console.error('Error saving Task Grid preferences:', error);
                        Dashboard.alert('Error saving Task Grid preferences');
                    } finally {
                        Dashboard.hideLoadingMsg();
                    }
                }

                function render() {
                    const tasks = scheduledTasks
                        .filter(function (task) { return !task.IsHidden; })
                        .sort(function (a, b) { return (a.Name || '').localeCompare(b.Name || ''); });

                    renderCalendar(tasks);
                    renderStyleList(tasks);
                    renderSchedulerLinks(tasks);
                }

                function renderCalendar(tasks) {
                    const calendar = document.querySelector('#TaskGridCalendar');
                    calendar.innerHTML = '';

                    appendCell(calendar, 'taskGridCorner', 1, 1, '');
                    for (let hour = 0; hour < 24; hour++) {
                        appendCell(calendar, 'taskGridHour', 1, hour + 2, String(hour).padStart(2, '0') + ':00');
                    }

                    const todayIndex = (new Date().getDay() + 6) % 7;
                    days.forEach(function (day, index) {
                        const dayCell = appendCell(calendar, 'taskGridDay' + (index === todayIndex ? ' taskGridDayToday' : ''), index + 2, 1, day);
                        dayCell.setAttribute('aria-label', day);

                        for (let hour = 0; hour < 24; hour++) {
                            appendCell(calendar, 'taskGridCell', index + 2, hour + 2, '');
                        }
                    });

                    const blocks = [];
                    tasks.forEach(function (task, taskIndex) {
                        const taskBlocks = buildBlocks(task, taskIndex);
                        if (taskBlocks.length > 0) {
                            blocks.push.apply(blocks, taskBlocks);
                        }
                    });

                    const displayBlocks = assignBlockLanes(mergeRetryBlocks(blocks));
                    updateCalendarRowHeight(calendar, displayBlocks);
                    displayBlocks.forEach(function (block) {
                        calendar.appendChild(createTaskBlock(block));
                    });

                    appendNowLine(calendar);
                    renderWarnings(displayBlocks);
                }

                function appendCell(parent, className, row, column, text) {
                    const cell = document.createElement('div');
                    cell.className = className;
                    cell.style.gridRow = String(row);
                    cell.style.gridColumn = String(column);
                    cell.textContent = text;
                    parent.appendChild(cell);
                    return cell;
                }

                function buildBlocks(task, taskIndex) {
                    const triggers = task.Triggers || [];
                    const blocks = [];
                    triggers.forEach(function (trigger) {
                        const type = String(trigger.Type || '').toLowerCase();
                        if (type === 'dailytrigger') {
                            days.forEach(function (day) {
                                blocks.push.apply(blocks, createBlocks(task, trigger, day, taskIndex));
                            });
                        } else if (type === 'weeklytrigger') {
                            const day = normalizeDay(trigger.DayOfWeek);
                            if (day) {
                                blocks.push.apply(blocks, createBlocks(task, trigger, day, taskIndex));
                            }
                        }
                    });
                    return blocks.filter(Boolean);
                }

                function createBlocks(task, trigger, day, taskIndex) {
                    const start = ticksToHours(trigger.TimeOfDayTicks || 0);
                    const duration = durationHours(task, trigger);
                    if (duration <= 0) {
                        return [];
                    }

                    const blocks = [];
                    let remaining = duration;
                    let segmentStart = start;
                    let dayIndex = dayIndexes[day];
                    let guard = 0;

                    while (remaining > 0 && guard < 7) {
                        const segmentDuration = Math.min(24 - segmentStart, remaining);
                        const startColumn = Math.floor(segmentStart) + 2;
                        const endColumn = Math.min(26, Math.max(startColumn + 1, Math.ceil(segmentStart + segmentDuration) + 2));
                        blocks.push({
                            task: task,
                            trigger: trigger,
                            triggers: [trigger],
                            day: days[dayIndex],
                            dayIndex: dayIndex,
                            start: segmentStart,
                            duration: segmentDuration,
                            totalDuration: duration,
                            startColumn: startColumn,
                            endColumn: endColumn,
                            color: getTaskColor(task, taskIndex),
                            warning: wasAbortedByShutdown(task),
                            heavy: isTaskHeavy(task),
                            label: formatTime(segmentStart) + ' - ' + formatTime(Math.min(24, segmentStart + segmentDuration))
                        });
                        remaining -= segmentDuration;
                        segmentStart = 0;
                        dayIndex = (dayIndex + 1) % 7;
                        guard++;
                    }

                    return blocks;
                }

                function mergeRetryBlocks(blocks) {
                    const groups = new Map();
                    blocks.forEach(function (block) {
                        const key = taskKey(block.task) + '|' + block.day;
                        if (!groups.has(key)) {
                            groups.set(key, []);
                        }
                        groups.get(key).push(block);
                    });

                    const merged = [];
                    groups.forEach(function (groupBlocks) {
                        groupBlocks
                            .sort(function (a, b) { return a.start - b.start; })
                            .forEach(function (block) {
                                const previous = merged.length ? merged[merged.length - 1] : null;
                                const sameTaskDay = previous &&
                                    taskKey(previous.task) === taskKey(block.task) &&
                                    previous.day === block.day;
                                const previousEnd = previous ? previous.start + previous.duration : 0;

                                if (sameTaskDay && block.start <= previousEnd) {
                                    mergeBlockInto(previous, block);
                                } else {
                                    merged.push(copyBlock(block));
                                }
                            });
                    });

                    return merged;
                }

                function assignBlockLanes(blocks) {
                    const lanesByDay = new Map();
                    const ordered = blocks.slice().sort(function (a, b) {
                        const durationDelta = b.duration - a.duration;
                        return durationDelta || a.start - b.start || String(a.task.Name || '').localeCompare(String(b.task.Name || ''));
                    });

                    ordered.forEach(function (block) {
                        const dayLanes = lanesByDay.get(block.day) || [];
                        let laneIndex = 0;
                        while (dayLanes[laneIndex] && dayLanes[laneIndex].some(function (laneBlock) { return blocksOverlap(block, laneBlock); })) {
                            laneIndex++;
                        }

                        if (!dayLanes[laneIndex]) {
                            dayLanes[laneIndex] = [];
                        }

                        dayLanes[laneIndex].push(block);
                        block.lane = laneIndex;
                        lanesByDay.set(block.day, dayLanes);
                    });

                    return blocks;
                }

                function updateCalendarRowHeight(calendar, blocks) {
                    const maxLane = blocks.reduce(function (highest, block) {
                        return Math.max(highest, block.lane || 0);
                    }, 0);
                    const rowHeight = Math.max(5.8, ((maxLane + 1) * 2.85) + 0.8);
                    calendar.style.gridTemplateRows = '2.4rem repeat(7, ' + rowHeight + 'rem)';
                }

                function copyBlock(block) {
                    return {
                        task: block.task,
                        trigger: block.trigger,
                        triggers: block.triggers ? block.triggers.slice() : [block.trigger],
                        day: block.day,
                        dayIndex: block.dayIndex,
                        start: block.start,
                        duration: block.duration,
                        totalDuration: block.totalDuration,
                        startColumn: block.startColumn,
                        endColumn: block.endColumn,
                        color: block.color,
                        warning: block.warning,
                        heavy: block.heavy,
                        label: block.label,
                        retryTimes: [block.start]
                    };
                }

                function mergeBlockInto(target, block) {
                    const end = Math.max(target.start + target.duration, block.start + block.duration);
                    target.duration = end - target.start;
                    target.totalDuration = Math.max(target.totalDuration || 0, target.duration);
                    target.endColumn = Math.max(target.endColumn, block.endColumn);
                    target.warning = target.warning || block.warning;
                    target.heavy = target.heavy || block.heavy;
                    target.triggers = target.triggers.concat(block.triggers || [block.trigger]);
                    target.retryTimes.push(block.start);
                    target.retryTimes = uniqueNumbers(target.retryTimes).sort(function (a, b) { return a - b; });
                    target.label = formatTime(target.start) + ' - ' + formatTime(Math.min(24, target.start + target.duration));
                    target.isRetryWindow = target.retryTimes.length > 1;
                }

                function createTaskBlock(block) {
                    const element = document.createElement('div');
                    element.className = 'taskGridBlock' + (block.warning ? ' taskGridBlockWarning' : '') + (block.heavy ? ' taskGridBlockHeavy' : '');
                    element.style.gridRow = String(block.dayIndex + 2);
                    element.style.gridColumn = block.startColumn + ' / ' + block.endColumn;
                    element.style.background = block.color;
                    element.style.marginTop = ((block.lane || 0) * 2.85 + 0.45) + 'rem';
                    element.title = block.task.Name + ' | ' + block.day + ' ' + block.label + retryTooltip(block) + tooltipStatus(block.task, block.trigger);
                    element.tabIndex = 0;
                    element.setAttribute('role', 'button');
                    element.setAttribute('aria-label', 'Show scheduler link for ' + (block.task.Name || 'scheduled task'));
                    element.addEventListener('click', function () {
                        scrollToSchedulerLink(block.task);
                    });
                    element.addEventListener('keydown', function (event) {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            scrollToSchedulerLink(block.task);
                        }
                    });

                    const title = document.createElement('span');
                    title.className = 'taskGridBlockTitle';
                    title.textContent = block.task.Name || 'Scheduled task';

                    const meta = document.createElement('span');
                    meta.className = 'taskGridBlockMeta';
                    meta.textContent = block.label + retryLabel(block) + durationLabel(block.task, block.trigger) + (block.warning ? ' | shutdown abort' : '');

                    element.appendChild(title);
                    element.appendChild(meta);
                    if (block.isRetryWindow) {
                        element.appendChild(createRetryTicks(block));
                    }

                    return element;
                }

                function createRetryTicks(block) {
                    const ticks = document.createElement('span');
                    ticks.className = 'taskGridRetryTicks';
                    const span = Math.max(block.duration, 0.01);
                    block.retryTimes.forEach(function (retryStart) {
                        const tick = document.createElement('span');
                        tick.className = 'taskGridRetryTick';
                        tick.style.left = Math.max(0, Math.min(100, ((retryStart - block.start) / span) * 100)) + '%';
                        ticks.appendChild(tick);
                    });
                    return ticks;
                }

                function appendNowLine(calendar) {
                    const now = new Date();
                    const mondayFirstDay = (now.getDay() + 6) % 7;
                    if (mondayFirstDay < 0 || mondayFirstDay > 6) {
                        return;
                    }

                    const hourWidthPercent = 100 / 25;
                    const leftPercent = (8 / 1180 * 100) + ((now.getHours() + now.getMinutes() / 60) * hourWidthPercent);
                    const line = document.createElement('div');
                    line.className = 'taskGridNowLine';
                    line.style.left = 'calc(' + leftPercent + '%)';
                    calendar.appendChild(line);
                }

                function renderWarnings(blocks) {
                    const warningContainer = document.querySelector('#TaskGridWarnings');
                    const shutdownWarnings = uniqueBy(blocks.filter(function (block) { return block.warning; }), function (block) { return taskKey(block.task); });
                    const heavyOverlaps = findHeavyOverlaps(blocks);
                    const messages = [];

                    shutdownWarnings.forEach(function (block) {
                        messages.push(block.task.Name + ' was most recently aborted by server shutdown.');
                    });
                    heavyOverlaps.forEach(function (warning) {
                        messages.push('Heavy tasks overlap on ' + warning.day + ': ' + warning.names + '.');
                    });

                    warningContainer.hidden = messages.length === 0;
                    warningContainer.innerHTML = messages.map(function (message) {
                        return '<div class="taskGridWarningItem">' + escapeHtml(message) + '</div>';
                    }).join('');
                }

                function renderStyleList(tasks) {
                    const container = document.querySelector('#TaskGridStyleList');
                    container.innerHTML = '';
                    tasks.forEach(function (task, index) {
                        const row = document.createElement('div');
                        row.className = 'taskGridStyleRow';
                        row.dataset.taskKey = taskKey(task);

                        const name = document.createElement('div');
                        name.className = 'taskGridTaskName';
                        name.innerHTML = '<strong>' + escapeHtml(task.Name || 'Scheduled task') + '</strong><span>' + escapeHtml(task.Category || task.Key || task.Id || '') + '</span>';

                        const color = document.createElement('input');
                        color.type = 'color';
                        color.className = 'taskGridColorInput';
                        color.value = getTaskColor(task, index);

                        const hex = document.createElement('input');
                        hex.type = 'text';
                        hex.className = 'taskGridHexInput';
                        hex.setAttribute('is', 'emby-input');
                        hex.setAttribute('maxlength', '7');
                        hex.value = color.value.toUpperCase();
                        color.addEventListener('input', function () {
                            hex.value = color.value.toUpperCase();
                            rememberColor(color.value);
                            updateRecentColorButtons();
                        });
                        hex.addEventListener('input', function () {
                            const normalized = normalizeHexColor(hex.value, '');
                            if (normalized) {
                                color.value = normalized;
                                hex.value = normalized.toUpperCase();
                                rememberColor(normalized);
                                updateRecentColorButtons();
                            }
                        });
                        hex.addEventListener('blur', function () {
                            const normalized = normalizeHexColor(hex.value, color.value);
                            color.value = normalized;
                            hex.value = normalized.toUpperCase();
                            rememberColor(normalized);
                            updateRecentColorButtons();
                        });

                        const recent = document.createElement('div');
                        recent.className = 'taskGridRecentColors';

                        const heavyLabel = document.createElement('label');
                        heavyLabel.className = 'taskGridHeavyLabel';
                        heavyLabel.innerHTML = '<input type="checkbox" class="taskGridHeavyInput" is="emby-checkbox" ' + (isTaskHeavy(task) ? 'checked' : '') + ' /><span>Heavy</span>';

                        row.appendChild(name);
                        row.appendChild(color);
                        row.appendChild(hex);
                        row.appendChild(recent);
                        row.appendChild(heavyLabel);
                        container.appendChild(row);
                    });
                    updateRecentColorButtons();
                }

                function updateRecentColorButtons() {
                    const colors = normalizeRecentColors(currentConfig.RecentColors || []);
                    document.querySelectorAll('.taskGridStyleRow').forEach(function (row) {
                        const container = row.querySelector('.taskGridRecentColors');
                        if (!container) {
                            return;
                        }

                        container.innerHTML = '';
                        colors.forEach(function (recentColor) {
                            const button = document.createElement('button');
                            button.type = 'button';
                            button.className = 'taskGridRecentColor';
                            button.style.setProperty('--task-grid-recent-color', recentColor);
                            button.title = recentColor.toUpperCase();
                            button.setAttribute('aria-label', 'Use color ' + recentColor.toUpperCase());
                            button.addEventListener('click', function () {
                                row.querySelector('.taskGridColorInput').value = recentColor;
                                row.querySelector('.taskGridHexInput').value = recentColor.toUpperCase();
                                rememberColor(recentColor);
                                updateRecentColorButtons();
                            });
                            container.appendChild(button);
                        });
                    });
                }

                function renderSchedulerLinks(tasks) {
                    const container = document.querySelector('#TaskGridSchedulerLinks');
                    container.innerHTML = '';
                    tasks.map(function (task, index) {
                        return { task: task, index: index };
                    }).filter(function (entry) {
                        return currentConfig.ShowUnscheduledTasks !== false || buildBlocks(entry.task, entry.index).length > 0;
                    }).forEach(function (entry) {
                        const task = entry.task;
                        const index = entry.index;
                        const id = task.Id || '';
                        const item = document.createElement('a');
                        item.className = 'taskGridSchedulerLink';
                        item.href = taskSchedulerUrl(id);
                        item.style.color = getTaskColor(task, index);
                        item.dataset.taskKey = taskKey(task);

                        const name = document.createElement('span');
                        name.textContent = task.Name || 'Scheduled task';

                        const summary = document.createElement('span');
                        summary.className = 'taskGridSchedulerSummary';
                        summary.textContent = describeTriggers(task.Triggers || []);

                        const action = document.createElement('em');
                        action.textContent = id ? 'Open scheduler' : 'No task id';

                        item.appendChild(name);
                        item.appendChild(summary);
                        item.appendChild(action);
                        if (!id) {
                            item.removeAttribute('href');
                        }
                        container.appendChild(item);
                    });
                }

                function scrollToSchedulerLink(task) {
                    const key = taskKey(task);
                    const link = Array.from(document.querySelectorAll('.taskGridSchedulerLink')).find(function (candidate) {
                        return candidate.dataset.taskKey === key;
                    });
                    if (!link) {
                        return;
                    }

                    document.querySelectorAll('.taskGridSchedulerLinkFocus').forEach(function (candidate) {
                        candidate.classList.remove('taskGridSchedulerLinkFocus');
                    });
                    link.classList.add('taskGridSchedulerLinkFocus');
                    link.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    window.setTimeout(function () {
                        link.classList.remove('taskGridSchedulerLinkFocus');
                    }, 2400);
                }

                function findHeavyOverlaps(blocks) {
                    const warnings = [];
                    const heavy = blocks.filter(function (block) { return block.heavy; });
                    days.forEach(function (day) {
                        const dayBlocks = heavy.filter(function (block) { return block.day === day; });
                        for (let i = 0; i < dayBlocks.length; i++) {
                            for (let j = i + 1; j < dayBlocks.length; j++) {
                                if (taskKey(dayBlocks[i].task) === taskKey(dayBlocks[j].task)) {
                                    continue;
                                }

                                if (dayBlocks[i].start < dayBlocks[j].start + dayBlocks[j].duration && dayBlocks[j].start < dayBlocks[i].start + dayBlocks[i].duration) {
                                    warnings.push({ day: day, names: dayBlocks[i].task.Name + ' and ' + dayBlocks[j].task.Name });
                                }
                            }
                        }
                    });
                    return warnings;
                }

                function blocksOverlap(first, second) {
                    return first.start < second.start + second.duration && second.start < first.start + first.duration;
                }

                function durationHours(task, trigger) {
                    const lastRuntime = lastRuntimeHours(task);
                    if (lastRuntime > 0) {
                        const roundedRuntime = roundUpToQuarterHour(lastRuntime);
                        if (trigger.MaxRuntimeTicks) {
                            return Math.max(Math.min(roundedRuntime, ticksToHours(trigger.MaxRuntimeTicks)), 1 / 12);
                        }

                        return Math.max(roundedRuntime, 1 / 12);
                    }

                    if (trigger.MaxRuntimeTicks) {
                        return Math.max(ticksToHours(trigger.MaxRuntimeTicks), 1 / 12);
                    }

                    return 0.5;
                }

                function lastRuntimeHours(task) {
                    const result = task.LastExecutionResult;
                    if (result && result.StartTimeUtc && result.EndTimeUtc) {
                        const start = new Date(result.StartTimeUtc).getTime();
                        const end = new Date(result.EndTimeUtc).getTime();
                        if (end > start) {
                            return (end - start) / 3600000;
                        }
                    }

                    return 0;
                }

                function durationLabel(task, trigger) {
                    const lastRuntime = lastRuntimeHours(task);
                    if (lastRuntime > 0) {
                        const roundedRuntime = durationHours(task, trigger);
                        const maxRuntime = trigger.MaxRuntimeTicks ? ' / max ' + formatDuration(ticksToHours(trigger.MaxRuntimeTicks)) : '';
                        return ' | last ' + formatDuration(lastRuntime) + ', shown ' + formatDuration(roundedRuntime) + maxRuntime;
                    }

                    if (trigger.MaxRuntimeTicks) {
                        return ' | max ' + formatDuration(ticksToHours(trigger.MaxRuntimeTicks));
                    }

                    return ' | estimated 30m';
                }

                function retryLabel(block) {
                    if (!block.isRetryWindow) {
                        return '';
                    }

                    return ' | ' + block.retryTimes.length + ' starts';
                }

                function retryTooltip(block) {
                    if (!block.isRetryWindow) {
                        return '';
                    }

                    return ' | Start times: ' + block.retryTimes.map(formatTime).join(', ');
                }

                function tooltipStatus(task, trigger) {
                    const parts = [];
                    if (task.State) {
                        parts.push('State: ' + task.State);
                    }
                    if (task.CurrentProgressPercentage != null) {
                        parts.push('Progress: ' + Math.round(task.CurrentProgressPercentage) + '%');
                    }
                    if (task.LastExecutionResult && task.LastExecutionResult.Status) {
                        parts.push('Last result: ' + task.LastExecutionResult.Status);
                    }
                    if (trigger.MaxRuntimeTicks) {
                        parts.push('Max runtime: ' + formatDuration(ticksToHours(trigger.MaxRuntimeTicks)));
                    }
                    return parts.length ? ' | ' + parts.join(' | ') : '';
                }

                function describeTriggers(triggers) {
                    if (!triggers.length) {
                        return 'No triggers';
                    }
                    return triggers.map(function (trigger) {
                        const type = String(trigger.Type || 'Unknown trigger').toLowerCase();
                        const maxRuntime = trigger.MaxRuntimeTicks ? ', max ' + formatDuration(ticksToHours(trigger.MaxRuntimeTicks)) : '';
                        if (type === 'dailytrigger') {
                            return 'Daily at ' + formatTime(ticksToHours(trigger.TimeOfDayTicks || 0)) + maxRuntime;
                        }
                        if (type === 'weeklytrigger') {
                            const day = normalizeDay(trigger.DayOfWeek) || 'selected day';
                            return day + ' at ' + formatTime(ticksToHours(trigger.TimeOfDayTicks || 0)) + maxRuntime;
                        }
                        if (trigger.IntervalTicks) {
                            return 'Every ' + formatDuration(ticksToHours(trigger.IntervalTicks)) + maxRuntime;
                        }
                        if (type === 'startuptrigger') {
                            return 'At server startup' + maxRuntime;
                        }
                        return trigger.Type || 'Unknown trigger';
                    }).join(', ');
                }

                function taskKey(task) {
                    return task.Key || task.Id || task.Name || '';
                }

                function taskSchedulerUrl(id) {
                    if (!id) {
                        return '#';
                    }

                    return webBaseUrl() + '#/dashboard/tasks/' + encodeURIComponent(String(id).replace(/-/g, ''));
                }

                function webBaseUrl() {
                    const path = window.location.pathname || '/web/';
                    const webIndex = path.toLowerCase().indexOf('/web/');
                    if (webIndex >= 0) {
                        return window.location.origin + path.substring(0, webIndex + 5);
                    }

                    return window.location.origin + '/web/';
                }

                function getStyle(task) {
                    const key = taskKey(task);
                    return (currentConfig.TaskStyles || []).find(function (style) {
                        return style.TaskKey === key;
                    });
                }

                function getTaskColor(task, index) {
                    const style = getStyle(task);
                    return normalizeHexColor(style && style.Color, defaultColors[index % defaultColors.length]);
                }

                function isTaskHeavy(task) {
                    const style = getStyle(task);
                    return !!(style && style.Heavy);
                }

                function wasAbortedByShutdown(task) {
                    const result = task.LastExecutionResult || {};
                    const text = [result.Status, result.ErrorMessage, result.LongErrorMessage].join(' ').toLowerCase();
                    return text.indexOf('shutdown') !== -1 || text.indexOf('aborted') !== -1;
                }

                function normalizeDay(day) {
                    if (day == null) {
                        return null;
                    }

                    const value = String(day);
                    if (/^\d+$/.test(value)) {
                        const dotnetDay = Number(value);
                        return days[(dotnetDay + 6) % 7] || null;
                    }

                    return days.find(function (candidate) {
                        return candidate.toLowerCase() === value.toLowerCase();
                    }) || null;
                }

                function ticksToHours(ticks) {
                    return Number(ticks || 0) / 10000000 / 3600;
                }

                function formatTime(hours) {
                    const totalMinutes = Math.round(hours * 60);
                    const hour = Math.floor(totalMinutes / 60) % 24;
                    const minute = totalMinutes % 60;
                    return String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
                }

                function formatDuration(hours) {
                    const minutes = Math.max(1, Math.round(hours * 60));
                    const wholeHours = Math.floor(minutes / 60);
                    const remainingMinutes = minutes % 60;
                    if (wholeHours && remainingMinutes) {
                        return wholeHours + 'h ' + remainingMinutes + 'm';
                    }
                    if (wholeHours) {
                        return wholeHours + 'h';
                    }
                    return remainingMinutes + 'm';
                }

                function roundUpToQuarterHour(hours) {
                    return Math.ceil(Math.max(hours, 1 / 60) * 4) / 4;
                }

                function uniqueBy(items, keySelector) {
                    const seen = new Set();
                    return items.filter(function (item) {
                        const key = keySelector(item);
                        if (seen.has(key)) {
                            return false;
                        }
                        seen.add(key);
                        return true;
                    });
                }

                function uniqueNumbers(values) {
                    return Array.from(new Set(values.map(function (value) {
                        return Math.round(value * 10000) / 10000;
                    })));
                }

                function normalizeHexColor(value, fallback) {
                    const text = String(value || '').trim();
                    const withHash = text.charAt(0) === '#' ? text : '#' + text;
                    if (/^#[0-9a-fA-F]{6}$/.test(withHash)) {
                        return withHash.toLowerCase();
                    }

                    return fallback || '';
                }

                function rememberColor(value) {
                    const color = normalizeHexColor(value, '');
                    if (!color) {
                        return;
                    }

                    const existing = currentConfig.RecentColors || [];
                    currentConfig.RecentColors = [color].concat(existing.filter(function (existingColor) {
                        return normalizeHexColor(existingColor, '') !== color;
                    })).slice(0, 12);
                }

                function normalizeRecentColors(colors) {
                    const normalized = [];
                    (colors || []).forEach(function (color) {
                        const value = normalizeHexColor(color, '');
                        if (value && normalized.indexOf(value) === -1) {
                            normalized.push(value);
                        }
                    });
                    return normalized.slice(0, 12);
                }

                function escapeHtml(value) {
                    return String(value == null ? '' : value)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#039;');
                }
            })();
        </script>
    </div>
</body>
</html>
