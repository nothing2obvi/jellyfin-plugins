name: "Task Grid"
guid: "a56a1707-aaeb-4ed5-bd95-1543ff817b9e"
version: "1.3.2.0"
targetAbi: "10.11.0.0, 12.0.0.0-rc2, 12.0.0.0-rc3"
framework: "net9.0, net10.0"
owner: "nothing2obvi"
overview: "Shows Jellyfin scheduled tasks on a weekly hour grid."
description: |
  Task Grid displays Jellyfin scheduled tasks on a Monday-first weekly grid with hour columns,
  color coding, heavy-task overlap warnings, refresh support, and red warnings for tasks most
  recently aborted by server shutdown.
category: "General"
artifacts:
  - "Jellyfin.Plugin.TaskGrid.dll"
changelog: |
  ## v1.3.2.0
  - Add editable hex color fields synced with the native color selector

  ## v1.3.1.0
  - Merge overlapping same-task triggers into one retry-window block
  - Show retry start markers and start-count labels for retry-window blocks
  - Keep per-task colors shared across every run of the same task

  ## v1.3.0.0
  - Add Jellyfin v12-rc3 package build
  - Refresh the catalog image with a rectangular Jellyfin plugin-list layout

  ## v1.2.0.0
  - Add Jellyfin v12-rc2 package build

  ## v1.1.0.0
  - Add build support for Jellyfin 10.11, Jellyfin v12-rc2, and Jellyfin v12-rc3
  - Allow Jellyfin v12 builds against package references or a local Jellyfin source tree

  ## v1.0.0.0
  - Initial Task Grid release
  - Add Monday-first weekly hour grid for Jellyfin scheduled tasks
  - Add per-task colors and heavy-task flags
  - Add refresh support and shutdown-abort warnings
