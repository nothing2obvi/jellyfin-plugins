name: "Task Grid"
guid: "a56a1707-aaeb-4ed5-bd95-1543ff817b9e"
version: "1.3.10.0"
targetAbi: "10.11.0.0, 12.0.0.0-rc2, 12.0.0.0-rc3"
framework: "net9.0, net10.0"
owner: "nothing2obvi"
overview: "Shows Jellyfin scheduled tasks on a weekly hour grid."
description: |
  Task Grid displays Jellyfin scheduled tasks on a Monday-first weekly grid with hour columns,
  color coding, optional conflict highlighting, refresh support, and red warnings for tasks most
  recently aborted by server shutdown.
category: "General"
artifacts:
  - "Jellyfin.Plugin.TaskGrid.dll"
changelog: |
  ## v1.3.10.0
  - Render fractional task durations and start times within hour columns so 15-minute tasks and half-hour starts show accurately
  - Keep schedule conflict highlighting gated strictly behind the conflict toggle
  - Add a separate opt-in highlight for tasks whose latest result was aborted or errored
  - Move recent colors into a compact Pick recent color dropdown

  ## v1.3.9.0
  - Fix visual lane overlap by giving task blocks a fixed row height
  - Preview task color, heavy flag, and conflict-ignore changes immediately in the grid before saving
  - Keep schedule conflict details visual-only in the grid instead of adding text warnings

  ## v1.3.8.0
  - Pack grid rows by actual time overlap so non-overlapping tasks can share a row without drawing on top of each other
  - Merge repeated same-task start times into a single retry-window block with white start markers
  - Add optional red conflict highlighting and per-task conflict ignore
  - Round completed-task runtime estimates to the nearest 15 minutes, while long limited tasks display the full time limit
  - Integrate native task scheduler links into each task row instead of using a separate Task Scheduler Links section
  - Add a saved grid zoom control that widens hour columns and enables horizontal scrolling

  ## v1.3.7.0
  - Display tasks with previous runtimes using the last runtime rounded up to the nearest 15 minutes, capped by max runtime

  ## v1.3.6.0
  - Replace the confusing Other Triggers section with trigger summaries in Task Scheduler Links
  - Add an option to hide tasks without daily or weekly grid triggers from the scheduler-link list

  ## v1.3.5.0
  - Stack overlapping task blocks into lanes with longer blocks above shorter overlaps
  - Scroll from a clicked grid block to its scheduler link

  ## v1.3.4.0
  - Add recently used color buttons beside each task color selector

  ## v1.3.3.0
  - Show Task Grid in Jellyfin's custom sidebar Extensions section
  - Add native Jellyfin task scheduler links for every scheduled task

  ## v1.3.2.0
  - Add editable hex color fields synced with the native color selector

  ## v1.3.1.0
  - Merge overlapping same-task triggers into one retry-window block
  - Show retry start markers and start-count labels for retry-window blocks
  - Keep per-task colors shared across every run of the same task

  ## v1.3.0.0
  - Add Jellyfin v12-rc3 package build
  - Refresh the catalog image with a rectangular Jellyfin plugin-list layout

  ## v1.2.0.0
  - Add Jellyfin v12-rc2 package build

  ## v1.1.0.0
  - Add build support for Jellyfin 10.11, Jellyfin v12-rc2, and Jellyfin v12-rc3
  - Allow Jellyfin v12 builds against package references or a local Jellyfin source tree

  ## v1.0.0.0
  - Initial Task Grid release
  - Add Monday-first weekly hour grid for Jellyfin scheduled tasks
  - Add per-task colors and heavy-task flags
  - Add refresh support and shutdown-abort warnings
