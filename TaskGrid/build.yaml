overview: "Shows Jellyfin scheduled tasks on a weekly hour grid."
description: |
  Task Grid displays Jellyfin scheduled tasks on a Monday-first weekly grid with hour columns,
  color coding, heavy-task overlap warnings, refresh support, and red warnings for tasks most
  recently aborted by server shutdown.
category: "General"
artifacts:
  - "Jellyfin.Plugin.TaskGrid.dll"
changelog: |
  ## v1.0.0.0
  - Initial Task Grid release
  - Add Monday-first weekly hour grid for Jellyfin scheduled tasks
  - Add per-task colors and heavy-task flags
  - Add refresh support and shutdown-abort warnings
